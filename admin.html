<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Video & Pricing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f0f0f] text-white font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminApp() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [password, setPassword] = useState('');
      const [activeTab, setActiveTab] = useState('add_movie');

      const [movies, setMovies] = useState(() => {
        const saved = localStorage.getItem('app_movies');
        return saved ? JSON.parse(saved) : [];
      });

      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem('user_wallet');
        return saved ? JSON.parse(saved) : { balance: 0.00, transactions: [] };
      });

      // Form States
      const [depositAmt, setDepositAmt] = useState('');
      const [title, setTitle] = useState('');
      const [img, setImg] = useState('');
      const [videoUrl, setVideoUrl] = useState('');
      const [originalPrice, setOriginalPrice] = useState('');
      const [price, setPrice] = useState('');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [isLoggedIn, activeTab, movies]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === '1234') setIsLoggedIn(true);
        else alert('លេខកូដសម្ងាត់មិនត្រឹមត្រូវ!');
      };

      // មុខងារបញ្ចូលរឿងថ្មី រួមទាំង Link វីដេអូ
      const handleAddMovie = (e) => {
        e.preventDefault();
        if (!title || !img || !videoUrl || !price) {
          return alert('សូមបំពេញ ចំណងជើង, Link រូបភាព, Link វីដេអូ, និងតម្លៃលក់!');
        }
        const newMovie = {
          id: Date.now(),
          title,
          img,
          videoUrl, // Direct Video URL (MP4, WebM...)
          originalPrice: originalPrice ? parseFloat(originalPrice) : null,
          price: parseFloat(price),
          views: 0
        };
        const updated = [newMovie, ...movies];
        setMovies(updated);
        localStorage.setItem('app_movies', JSON.stringify(updated));
        alert('បានបញ្ចូលភាពយន្ត និងវីដេអូដោយជោគជ័យ!');
        setTitle('');
        setImg('');
        setVideoUrl('');
        setOriginalPrice('');
        setPrice('');
      };

      // មុខងារបញ្ចូលលុយឱ្យភ្ញៀវ
      const handleDeposit = (e) => {
        e.preventDefault();
        if (!depositAmt || parseFloat(depositAmt) <= 0) return alert('សូមបញ្ចូលចំនួនទឹកប្រាក់');
        const num = parseFloat(depositAmt);
        const updatedWallet = {
          ...wallet,
          balance: parseFloat((wallet.balance + num).toFixed(2)),
          transactions: [
            {
              id: 'ADMIN-DEP-' + Math.floor(100000 + Math.random() * 900000),
              date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
              type: 'income',
              amount: num
            },
            ...wallet.transactions
          ]
        };
        setWallet(updatedWallet);
        localStorage.setItem('user_wallet', JSON.stringify(updatedWallet));
        alert(`បានបញ្ចូលទឹកប្រាក់ $${num.toFixed(2)} ឱ្យភ្ញៀវជោគជ័យ!`);
        setDepositAmt('');
      };

      const handleDeleteMovie = (id) => {
        if (confirm('តើអ្នកពិតជាចង់លុបរឿងនេះមែនទេ?')) {
          const updated = movies.filter(m => m.id !== id);
          setMovies(updated);
          localStorage.setItem('app_movies', JSON.stringify(updated));
        }
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-[#1a1a1a] border border-neutral-800 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
              <div className="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 text-black font-black text-xl">A</div>
              <h2 className="text-lg font-bold text-white mb-1">Admin Portal</h2>
              <p className="text-xs text-neutral-400 mb-5">បញ្ចូល Password ដើម្បីគ្រប់គ្រងវីដេអូ និងតម្លៃ</p>
              <input
                type="password"
                placeholder="លេខកូដសម្ងាត់ (1234)"
                value={password}
                onChange={e => setPassword(e.target.value)}
                className="w-full bg-[#111] border border-neutral-700 rounded-xl px-4 py-2.5 text-sm text-center text-white mb-4 focus:outline-none focus:border-amber-400"
              />
              <button type="submit" className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs transition">
                ចូលប្រព័ន្ធ (Login)
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto min-h-screen p-4 pb-12">
          <div className="flex items-center justify-between bg-[#1a1a1a] border border-neutral-800 p-4 rounded-2xl mb-6 shadow-md">
            <div>
              <h1 className="text-lg font-bold text-white flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-green-500"></span> Angkor DC Admin Portal
              </h1>
              <p className="text-xs text-neutral-400">គ្រប់គ្រងវីដេអូភាពយន្ត និងសមតុល្យលុយភ្ញៀវ</p>
            </div>
            <a href="index.html" target="_blank" className="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs px-3 py-1.5 rounded-lg border border-neutral-700">
              មើលវេបសាយភ្ញៀវ ↗
            </a>
          </div>

          <div className="flex gap-2 mb-6 bg-[#161616] p-1.5 rounded-xl border border-neutral-800">
            <button
              onClick={() => setActiveTab('add_movie')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${activeTab === 'add_movie' ? 'bg-amber-400 text-black shadow' : 'text-neutral-400 hover:text-white'}`}
            >
              + បញ្ចូលរឿង & វីដេអូ
            </button>
            <button
              onClick={() => setActiveTab('deposit')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${activeTab === 'deposit' ? 'bg-amber-400 text-black shadow' : 'text-neutral-400 hover:text-white'}`}
            >
              ដាក់លុយឱ្យភ្ញៀវ
            </button>
            <button
              onClick={() => setActiveTab('views')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${activeTab === 'views' ? 'bg-amber-400 text-black shadow' : 'text-neutral-400 hover:text-white'}`}
            >
              មើល Views & រឿង ({movies.length})
            </button>
          </div>

          {/* ផ្នែកបញ្ចូលរឿង និងវីដេអូ */}
          {activeTab === 'add_movie' && (
            <div className="bg-[#1a1a1a] border border-neutral-800 p-5 rounded-2xl space-y-4">
              <h3 className="text-sm font-bold text-white">បញ្ចូលភាពយន្តថ្មី រួមទាំង Video URL</h3>
              <form onSubmit={handleAddMovie} className="space-y-3">
                <div>
                  <label className="text-xs text-neutral-400 block mb-1">ចំណងជើងរឿង</label>
                  <input
                    type="text"
                    placeholder="ឧ. ព្រលឹងខ្មោច"
                    value={title}
                    onChange={e => setTitle(e.target.value)}
                    className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="text-xs text-neutral-400 block mb-1">តំណភ្ជាប់រូប Poster (Image Link)</label>
                  <input
                    type="text"
                    placeholder="https://.../poster.jpg"
                    value={img}
                    onChange={e => setImg(e.target.value)}
                    className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="text-xs text-amber-400 font-bold block mb-1">តំណភ្ជាប់វីដេអូរឿង (Direct Video MP4 URL)</label>
                  <input
                    type="text"
                    placeholder="https://commondatastorage.googleapis.com/.../movie.mp4"
                    value={videoUrl}
                    onChange={e => setVideoUrl(e.target.value)}
                    className="w-full bg-[#111] border border-amber-500 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  />
                  <span className="text-[10px] text-neutral-500 mt-1 block leading-tight">
                    *ចំណាំ៖ អាចប្រើ Direct MP4 Link ពី Hosting, AWS S3, Cloudinary, ឬ Google Cloud។
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-neutral-400 block mb-1">តម្លៃដើម ($ USD)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="2.50"
                      value={originalPrice}
                      onChange={e => setOriginalPrice(e.target.value)}
                      className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-amber-400 font-bold block mb-1">តម្លៃលក់/បញ្ចុះ ($ USD)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="1.60"
                      value={price}
                      onChange={e => setPrice(e.target.value)}
                      className="w-full bg-[#111] border border-amber-500 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                    />
                  </div>
                </div>

                <button type="submit" className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs transition">
                  + បង្ហោះរឿង និងវីដេអូទៅវេបសាយ
                </button>
              </form>
            </div>
          )}

          {/* ផ្នែកដាក់លុយឱ្យភ្ញៀវ */}
          {activeTab === 'deposit' && (
            <div className="bg-[#1a1a1a] border border-neutral-800 p-5 rounded-2xl space-y-4">
              <h3 className="text-sm font-bold text-white">បញ្ចូលទឹកប្រាក់ទៅ Wallet ភ្ញៀវ</h3>
              <div className="bg-[#111] p-4 rounded-xl border border-neutral-800 flex items-center justify-between">
                <div>
                  <p className="text-xs text-neutral-400">សមតុល្យភ្ញៀវបច្ចុប្បន្ន</p>
                  <p className="text-2xl font-black text-amber-400 mt-0.5">${parseFloat(wallet.balance || 0).toFixed(2)} USD</p>
                </div>
              </div>
              <form onSubmit={handleDeposit} className="space-y-3">
                <div>
                  <label className="text-xs text-neutral-400 block mb-1">ចំនួនទឹកប្រាក់ត្រូវបញ្ចូល ($ USD)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="ឧ. 5.00"
                    value={depositAmt}
                    onChange={e => setDepositAmt(e.target.value)}
                    className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400"
                  />
                </div>
                <button type="submit" className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                  + បញ្ចូលទឹកប្រាក់ភ្លាមៗ
                </button>
              </form>
            </div>
          )}

          {/* ផ្នែកមើលចំនួនអ្នកមើល និងលុបរឿង */}
          {activeTab === 'views' && (
            <div className="bg-[#1a1a1a] border border-neutral-800 p-5 rounded-2xl space-y-3">
              <h3 className="text-sm font-bold text-white mb-2">បញ្ជីភាពយន្ត និងស្ថិតិអ្នកទស្សនា</h3>
              <div className="space-y-2">
                {movies.map(m => (
                  <div key={m.id} className="flex items-center justify-between p-3 rounded-xl bg-[#111] border border-neutral-800">
                    <div className="flex items-center gap-3">
                      <img src={m.img} className="w-10 h-14 object-cover rounded-lg border border-neutral-700" />
                      <div>
                        <p className="text-xs font-bold text-white truncate w-40">{m.title}</p>
                        <p className="text-amber-400 text-xs font-bold">${m.price}</p>
                        <p className="text-[10px] text-neutral-500 truncate w-40">🎬 {m.videoUrl ? 'មានវីដេអូ' : 'គ្មានវីដេអូ'}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="bg-neutral-800 text-neutral-200 text-xs font-bold px-2.5 py-1 rounded-lg border border-neutral-700">
                        👁️ {m.views || 0} views
                      </span>
                      <button onClick={() => handleDeleteMovie(m.id)} className="text-red-400 hover:text-red-300 text-xs">
                        លុប
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<AdminApp />, document.getElementById('root'));
  </script>
</body>
</html>
