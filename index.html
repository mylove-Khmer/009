<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC Web</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QR Code Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-black text-white font-sans selection:bg-amber-400 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ទិន្នន័យភាពយន្តគំរូ
    const MOVIES = [
      { id: 1, title: "The Last Ritual", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80" },
      { id: 2, title: "Horror Night", img: "https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=500&q=80" },
      { id: 3, title: "The Dark Soul", img: "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80" },
      { id: 4, title: "Ancient Mystery", img: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=500&q=80" }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [wallet, setWallet] = useState({ balance: 2.15, transactions: [] });
      const [showTopUp, setShowTopUp] = useState(false);

      // ទាញយកទិន្នន័យ Wallet
      const fetchWallet = async () => {
        try {
          const res = await fetch('http://localhost:5000/api/wallet');
          const data = await res.json();
          setWallet(data);
        } catch (e) {
          console.error("Backend not running, using offline dummy data");
        }
      };

      useEffect(() => {
        fetchWallet();
      }, []);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#0d0d0d] flex flex-col justify-between relative shadow-2xl pb-20">
          {/* Header */}
          <header className="flex items-center justify-between px-4 py-3 sticky top-0 bg-[#0d0d0d]/90 backdrop-blur border-b border-neutral-900 z-40">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 bg-amber-500 rounded flex items-center justify-center font-bold text-black text-sm">A</div>
              <span className="text-lg font-bold tracking-wide text-white">Angkor DC</span>
            </div>
            <div className="flex items-center gap-4 text-neutral-300">
              <i data-lucide="search" className="w-5 h-5 cursor-pointer"></i>
              <i data-lucide="bell" className="w-5 h-5 cursor-pointer"></i>
              <i data-lucide="user" className="w-5 h-5 cursor-pointer"></i>
            </div>
          </header>

          {/* Main Content Pages */}
          <main className="flex-1">
            {currentTab === 'home' && <HomePage onWatch={() => setCurrentTab('movies')} />}
            {currentTab === 'movies' && <MoviesPage />}
            {currentTab === 'wallet' && <WalletPage wallet={wallet} onOpenTopUp={() => setShowTopUp(true)} />}
            {currentTab === 'library' && <LibraryPage />}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 max-w-md w-full bg-[#141414] border-t border-neutral-800 flex justify-around py-2.5 z-40">
            {[
              { id: 'home', label: 'Home', icon: 'home' },
              { id: 'movies', label: 'All Movies', icon: 'film' },
              { id: 'wallet', label: 'Wallet', icon: 'wallet' },
              { id: 'library', label: 'Library', icon: 'bookmark' },
            ].map(tab => (
              <button 
                key={tab.id} 
                onClick={() => setCurrentTab(tab.id)}
                className={`flex flex-col items-center gap-1 ${currentTab === tab.id ? 'text-amber-400' : 'text-neutral-500'}`}
              >
                <i data-lucide={tab.icon} className="w-5 h-5"></i>
                <span className="text-[10px] font-medium">{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* Modal KHQR Top Up */}
          {showTopUp && (
            <TopUpModal 
              onClose={() => setShowTopUp(false)} 
              onSuccess={() => { setShowTopUp(false); fetchWallet(); }}
            />
          )}
        </div>
      );
    }

    // ទំព័រ Home
    function HomePage({ onWatch }) {
      useEffect(() => { lucide.createIcons(); }, []);
      return (
        <div className="space-y-6">
          {/* Banner Hero */}
          <div className="relative w-full h-[420px]">
            <img src={MOVIES[0].img} className="w-full h-full object-cover brightness-75" />
            <div className="absolute inset-0 bg-gradient-to-t from-[#0d0d0d] via-transparent to-black/30"></div>
            <div className="absolute bottom-6 left-0 right-0 flex flex-col items-center gap-3">
              <h1 className="text-2xl font-black tracking-widest text-red-500 drop-shadow-md">THE LAST RITUAL</h1>
              <button onClick={onWatch} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-8 py-2 rounded-full shadow-lg transition text-sm">
                Watch Movie
              </button>
              <div className="flex gap-1.5 mt-2">
                <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                <span className="w-2 h-2 rounded-full bg-neutral-600"></span>
                <span className="w-2 h-2 rounded-full bg-neutral-600"></span>
              </div>
            </div>
          </div>

          {/* Movie Rows */}
          {['Coming Soon', 'New Release', 'Horror-Comedy'].map((section, idx) => (
            <div key={idx} className="px-4">
              <h2 className="text-sm font-bold text-white mb-2 flex items-center gap-1 cursor-pointer">
                {section} <span className="text-amber-400 text-xs">›</span>
              </h2>
              <div className="flex gap-3 overflow-x-auto no-scrollbar py-1">
                {MOVIES.map(m => (
                  <div key={m.id} className="flex-none w-32 rounded-md overflow-hidden bg-neutral-900 border border-neutral-800">
                    <img src={m.img} className="w-full h-44 object-cover" />
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ទំព័រ All Movies
    function MoviesPage() {
      return (
        <div className="p-4">
          <h1 className="text-lg font-bold text-white mb-4 text-center">All Movies</h1>
          <div className="grid grid-cols-3 gap-2.5">
            {[...MOVIES, ...MOVIES, ...MOVIES].map((m, idx) => (
              <div key={idx} className="rounded-md overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src={m.img} className="w-full h-40 object-cover" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ទំព័រ Wallet (មានកត់ត្រា Balance និង History ដូចក្នុងវីដេអូ)
    function WalletPage({ wallet, onOpenTopUp }) {
      useEffect(() => { lucide.createIcons(); }, []);
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-lg font-bold text-center text-white mb-2">Wallet</h1>

          {/* Balance Card */}
          <div className="bg-[#171717] border border-neutral-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <p className="text-xs text-neutral-400">Balance</p>
              <h2 className="text-2xl font-bold text-amber-400">${wallet.balance.toFixed(2)} $</h2>
            </div>
            <button onClick={onOpenTopUp} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-5 py-2 rounded-xl text-xs transition">
              Top Up
            </button>
          </div>

          {/* Transactions List */}
          <div className="space-y-2 mt-4">
            {wallet.transactions.map((tx, idx) => (
              <div key={idx} className="flex items-center justify-between py-3 border-b border-neutral-900">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-neutral-800 flex items-center justify-center">
                    <i data-lucide={tx.type === 'income' ? 'wallet' : 'shopping-cart'} className="w-4 h-4 text-neutral-300"></i>
                  </div>
                  <div>
                    <p className="text-[11px] text-neutral-400">{tx.date}</p>
                    <p className="text-xs font-mono text-neutral-200">{tx.id}</p>
                  </div>
                </div>
                <div className={`font-bold text-sm ${tx.type === 'income' ? 'text-green-500' : 'text-red-500'}`}>
                  {tx.type === 'income' ? `+${tx.amount.toFixed(2)} $` : `-${tx.amount.toFixed(2)} $`}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ទំព័រ Library
    function LibraryPage() {
      return (
        <div className="p-4">
          <h1 className="text-lg font-bold text-center text-white mb-4">My Library</h1>
          <div className="grid grid-cols-3 gap-2.5">
            {MOVIES.slice(0, 3).map((m, idx) => (
              <div key={idx} className="rounded-md overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src={m.img} className="w-full h-40 object-cover" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Pop-up Modal ស្កេន Bakong KHQR
    function TopUpModal({ onClose, onSuccess }) {
      const [amount, setAmount] = useState('1.99');
      const [qrData, setQrData] = useState(null);
      const [loading, setLoading] = useState(false);
      const qrContainerRef = useRef(null);

      const handleGetQR = async () => {
        setLoading(true);
        try {
          const res = await fetch('http://localhost:5000/api/wallet/generate-khqr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount })
          });
          const data = await res.json();
          if (data.success) {
            setQrData(data);
          }
        } catch (e) {
          alert('សូមបើក Backend Server ជាមុន (node server.js)');
        } finally {
          setLoading(false);
        }
      };

      // បង្ហាញ QR Code នៅពេលទទួលបាន qrString
      useEffect(() => {
        if (qrData && qrContainerRef.current) {
          qrContainerRef.current.innerHTML = '';
          new QRCode(qrContainerRef.current, {
            text: qrData.qrString,
            width: 170,
            height: 170,
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }, [qrData]);

      // បញ្ជាក់ថាបានបាញ់លុយរួច
      const handleConfirm = async () => {
        try {
          await fetch('http://localhost:5000/api/wallet/confirm-topup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: qrData.amount, billNumber: qrData.billNumber })
          });
          alert('បញ្ចូលទឹកប្រាក់ជោគជ័យ!');
          onSuccess();
        } catch (e) {
          alert('បរាជ័យក្នុងការបញ្ចូលលុយ');
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#171717] border border-neutral-800 rounded-2xl p-5 w-full max-w-xs text-center shadow-xl">
            {!qrData ? (
              <div>
                <h3 className="text-base font-bold text-white mb-2">បញ្ចូលទឹកប្រាក់ (Top Up)</h3>
                <p className="text-neutral-400 text-xs mb-4">ជ្រើសរើសចំនួនទឹកប្រាក់ ($ USD)</p>
                <div className="grid grid-cols-3 gap-2 mb-5">
                  {['1.60', '1.99', '5.00', '6.99', '10.00'].map(val => (
                    <button
                      key={val}
                      onClick={() => setAmount(val)}
                      className={`py-2 rounded-lg border text-xs font-semibold ${
                        amount === val ? 'border-amber-400 bg-amber-400/10 text-amber-400' : 'border-neutral-800 text-neutral-300'
                      }`}
                    >
                      ${val}
                    </button>
                  ))}
                </div>
                <button
                  onClick={handleGetQR}
                  disabled={loading}
                  className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs transition"
                >
                  {loading ? 'កំពុងបង្កើត...' : `បន្តទូទាត់ $${amount}`}
                </button>
                <button onClick={onClose} className="text-neutral-500 text-xs mt-3 block w-full">បោះបង់</button>
              </div>
            ) : (
              <div className="flex flex-col items-center">
                <div className="bg-red-600 text-white font-black px-4 py-0.5 rounded-t text-[10px] tracking-wider mb-2">
                  BAKONG KHQR
                </div>
                <div className="bg-white p-2.5 rounded-xl mb-3 shadow-inner" ref={qrContainerRef}></div>
                <p className="text-xs font-bold text-neutral-200">SAMNANG MON</p>
                <p className="text-amber-400 font-black text-xl my-1">${qrData.amount} USD</p>
                <p className="text-neutral-500 text-[10px] mb-3">ស្កេនជាមួយ Bakong ឬ App ធនាគារនានា</p>
                
                <a 
                  href={qrData.deepLink}
                  className="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-xl text-xs font-bold mb-2 block"
                >
                  បើក Bakong App
                </a>
                <button 
                  onClick={handleConfirm}
                  className="w-full bg-amber-400 hover:bg-amber-500 text-black py-2 rounded-xl text-xs font-bold mb-2"
                >
                  ខ្ញុំបានបាញ់លុយរួចរាល់
                </button>
                <button onClick={onClose} className="text-neutral-500 text-xs">បិទផ្ទាំង</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
