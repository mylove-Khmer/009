<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .khqr-header-cut {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }
  </style>
</head>
<body class="bg-[#121212] text-white font-sans selection:bg-amber-400 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function crc16CCITT(str) {
      let crc = 0xFFFF;
      for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
          if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function buildDynamicKHQR(amount) {
      const formattedAmount = parseFloat(amount).toFixed(2);
      const amtLength = formattedAmount.length < 10 ? '0' + formattedAmount.length : String(formattedAmount.length);
      const tag54 = `54${amtLength}${formattedAmount}`;
      const part1 = "00020101021230510016abaakhppxxx@abaa01151260903142910660208ABA Bank520465135303840";
      const part2 = "5802KH5911MON SAMNANG6012KAMPONG THOM624268380010PAYWAY@ABA0107195096202090324860766304";
      const rawPayload = part1 + tag54 + part2;
      return rawPayload + crc16CCITT(rawPayload);
    }

    const DEFAULT_MOVIES = [
      { 
        id: 1, 
        title: "The Last Ritual", 
        originalPrice: 2.50, 
        price: 1.60, 
        views: 1420, 
        img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
      },
      { 
        id: 2, 
        title: "Horror Night", 
        originalPrice: 2.00, 
        price: 1.60, 
        views: 890, 
        img: "https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=500&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" 
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [currentTab, setCurrentTab] = useState('home');
      const [showTopUp, setShowTopUp] = useState(false);
      const [playingMovie, setPlayingMovie] = useState(null);

      const [movies, setMovies] = useState(() => {
        const saved = localStorage.getItem('app_movies');
        return saved ? JSON.parse(saved) : DEFAULT_MOVIES;
      });

      // កំណត់សមតុល្យដើមឱ្យភ្ញៀវស្មើ $0.00 ដាច់ខាត (គ្មានលុយទេពេលចុះឈ្មោះដំបូង)
      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem('user_wallet');
        return saved ? JSON.parse(saved) : {
          balance: 0.00,
          purchasedMovieIds: [],
          transactions: []
        };
      });

      useEffect(() => {
        localStorage.setItem('user_wallet', JSON.stringify(wallet));
      }, [wallet]);

      useEffect(() => {
        const handleStorage = () => {
          const m = localStorage.getItem('app_movies');
          const w = localStorage.getItem('user_wallet');
          if (m) setMovies(JSON.parse(m));
          if (w) setWallet(JSON.parse(w));
        };
        window.addEventListener('storage', handleStorage);
        return () => window.removeEventListener('storage', handleStorage);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentTab, showTopUp, currentUser, playingMovie]);

      const handleWatch = (movie) => {
        const isPurchased = wallet.purchasedMovieIds && wallet.purchasedMovieIds.includes(movie.id);
        
        if (!isPurchased) {
          if (wallet.balance < movie.price) {
            alert(`សមតុល្យរបស់អ្នកគឺ $${wallet.balance.toFixed(2)} (មិនគ្រប់គ្រាន់ទេ)។ សូមបញ្ចូលទឹកប្រាក់ $${movie.price.toFixed(2)} ដើម្បីទស្សនា!`);
            setShowTopUp(true);
            return;
          }

          const confirmBuy = confirm(`រឿងនេះតម្លៃ $${movie.price.toFixed(2)}។ តើអ្នកចង់កាត់ទឹកប្រាក់ដើម្បីទស្សនាទេ?`);
          if (!confirmBuy) return;

          setWallet(prev => ({
            ...prev,
            balance: parseFloat((prev.balance - movie.price).toFixed(2)),
            purchasedMovieIds: [...(prev.purchasedMovieIds || []), movie.id],
            transactions: [
              {
                id: 'TICKET-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                type: 'expense',
                amount: movie.price
              },
              ...prev.transactions
            ]
          }));
        }

        const updated = movies.map(m => m.id === movie.id ? { ...m, views: (m.views || 0) + 1 } : m);
        setMovies(updated);
        localStorage.setItem('app_movies', JSON.stringify(updated));
        setPlayingMovie(movie);
      };

      if (!currentUser) {
        return <AuthScreen onLoginSuccess={(user) => setCurrentUser(user)} />;
      }

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#0d0d0d] flex flex-col justify-between relative shadow-2xl pb-20 border-x border-neutral-900">
          <header className="flex items-center justify-between px-4 py-3 sticky top-0 bg-[#0d0d0d]/95 backdrop-blur border-b border-neutral-900 z-40">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentTab('home')}>
              <div className="w-7 h-7 bg-amber-500 rounded flex items-center justify-center font-black text-black text-sm">A</div>
              <span className="text-lg font-bold tracking-wide text-white">Angkor DC</span>
            </div>
            <div className="flex items-center gap-3 text-neutral-300">
              <span className="text-xs font-semibold text-amber-400">👤 {currentUser.name}</span>
              <button 
                onClick={() => {
                  if (confirm('តើអ្នកចង់ចាកចេញ (Logout) មែនទេ?')) {
                    localStorage.removeItem('current_user');
                    setCurrentUser(null);
                  }
                }}
                className="text-[10px] bg-neutral-800 hover:bg-neutral-700 px-2 py-1 rounded text-neutral-400"
              >
                Logout
              </button>
            </div>
          </header>

          <main className="flex-1">
            {currentTab === 'home' && <HomePage movies={movies} onWatch={handleWatch} />}
            {currentTab === 'movies' && <MoviesPage movies={movies} onWatch={handleWatch} />}
            {currentTab === 'wallet' && <WalletPage wallet={wallet} onOpenTopUp={() => setShowTopUp(true)} />}
            {currentTab === 'library' && <LibraryPage movies={movies} wallet={wallet} onWatch={handleWatch} />}
          </main>

          <nav className="fixed bottom-0 max-w-md w-full bg-[#141414] border-t border-neutral-800 flex justify-around py-2.5 z-40">
            {[
              { id: 'home', label: 'Home', icon: 'home' },
              { id: 'movies', label: 'All Movies', icon: 'film' },
              { id: 'wallet', label: 'Wallet', icon: 'wallet' },
              { id: 'library', label: 'Library', icon: 'bookmark' },
            ].map(tab => (
              <button 
                key={tab.id} 
                onClick={() => setCurrentTab(tab.id)}
                className={`flex flex-col items-center gap-1 ${currentTab === tab.id ? 'text-amber-400' : 'text-neutral-500'}`}
              >
                <i data-lucide={tab.icon} className="w-5 h-5"></i>
                <span className="text-[10px] font-medium">{tab.label}</span>
              </button>
            ))}
          </nav>

          {playingMovie && (
            <VideoPlayerModal movie={playingMovie} onClose={() => setPlayingMovie(null)} />
          )}

          {showTopUp && <TopUpModal onClose={() => setShowTopUp(false)} />}
        </div>
      );
    }

    function AuthScreen({ onLoginSuccess }) {
      const [isRegister, setIsRegister] = useState(false);
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || !phone) return alert('សូមបំពេញឈ្មោះ និងលេខទូរស័ព្ទ');
        const user = { name, phone };
        localStorage.setItem('current_user', JSON.stringify(user));
        
        // ធានាថាកាបូបលុយត្រូវបានកំណត់ត្រឹម 0.00$ ពេលភ្ញៀវចុះឈ្មោះដំបូង
        if (!localStorage.getItem('user_wallet')) {
          localStorage.setItem('user_wallet', JSON.stringify({
            balance: 0.00,
            purchasedMovieIds: [],
            transactions: []
          }));
        }
        onLoginSuccess(user);
      };

      return (
        <div className="min-h-screen bg-[#0d0d0d] flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-[#171717] border border-neutral-800 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <div className="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 text-black font-black text-xl">A</div>
            <h2 className="text-xl font-black text-white mb-1">Angkor DC</h2>
            <p className="text-xs text-neutral-400 mb-6">{isRegister ? 'ចុះឈ្មោះបង្កើតគណនីថ្មី' : 'សូមចូលប្រើប្រាស់ដើម្បីទស្សនាភាពយន្ត'}</p>

            <div className="space-y-3 mb-5 text-left">
              <div>
                <label className="text-[11px] text-neutral-400 block mb-1">ឈ្មោះរបស់អ្នក</label>
                <input
                  type="text"
                  placeholder="ឧ. សុខ សាន"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400"
                />
              </div>
              <div>
                <label className="text-[11px] text-neutral-400 block mb-1">លេខទូរស័ព្ទ</label>
                <input
                  type="tel"
                  placeholder="012 345 678"
                  value={phone}
                  onChange={e => setPhone(e.target.value)}
                  className="w-full bg-[#111] border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400"
                />
              </div>
            </div>

            <button type="submit" className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs transition mb-3">
              {isRegister ? 'ចុះឈ្មោះភ្លាមៗ' : 'ចូលទស្សនា (Login)'}
            </button>

            <button type="button" onClick={() => setIsRegister(!isRegister)} className="text-[11px] text-neutral-400 hover:text-amber-400">
              {isRegister ? 'មានគណនីរួចហើយ? ចូលប្រើប្រាស់' : 'មិនទាន់មានគណនី? ចុចចុះឈ្មោះនៅទីនេះ'}
            </button>
          </form>
        </div>
      );
    }

    function VideoPlayerModal({ movie, onClose }) {
      return (
        <div className="fixed inset-0 bg-black z-50 flex flex-col justify-center items-center">
          <div className="w-full max-w-2xl bg-black relative flex flex-col">
            <div className="flex justify-between items-center px-4 py-3 bg-neutral-900 border-b border-neutral-800">
              <h3 className="font-bold text-sm text-white truncate">{movie.title}</h3>
              <button onClick={onClose} className="text-neutral-400 hover:text-white text-xs bg-neutral-800 px-3 py-1 rounded-lg">✕ បិទ</button>
            </div>
            <div className="w-full aspect-video bg-black flex items-center justify-center">
              {movie.videoUrl ? (
                <video src={movie.videoUrl} controls autoPlay className="w-full h-full object-contain" />
              ) : (
                <div className="text-center text-neutral-500 p-4">
                  <p className="text-sm">រឿងនេះមិនទាន់មាន Link វីដេអូនៅឡើយទេ។</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function HomePage({ movies, onWatch }) {
      const featured = movies[0] || {};
      return (
        <div className="space-y-6">
          <div className="relative w-full h-[420px]">
            <img src={featured.img} className="w-full h-full object-cover brightness-75" />
            <div className="absolute inset-0 bg-gradient-to-t from-[#0d0d0d] via-transparent to-black/40"></div>
            <div className="absolute bottom-6 left-0 right-0 flex flex-col items-center gap-2">
              <h1 className="text-2xl font-black tracking-widest text-red-500 drop-shadow-md uppercase text-center px-4">{featured.title}</h1>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-amber-400 font-bold text-base">${parseFloat(featured.price || 1.60).toFixed(2)}</span>
                {featured.originalPrice && <span className="text-neutral-500 line-through text-xs">${parseFloat(featured.originalPrice).toFixed(2)}</span>}
                <span className="text-neutral-400 text-xs ml-2">👁️ {featured.views || 0} Views</span>
              </div>
              <button onClick={() => onWatch(featured)} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-8 py-2.5 rounded-full shadow-lg transition text-sm flex items-center gap-2">
                <span>▶ Watch Movie</span>
              </button>
            </div>
          </div>

          <div className="px-4">
            <h2 className="text-sm font-bold text-white mb-2 flex items-center gap-1">
              ភាពយន្តទាំងអស់ <span className="text-amber-400 text-xs">›</span>
            </h2>
            <div className="flex gap-3 overflow-x-auto no-scrollbar py-1">
              {movies.map(m => (
                <div key={m.id} onClick={() => onWatch(m)} className="flex-none w-32 rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer">
                  <div className="relative">
                    <img src={m.img} className="w-full h-44 object-cover" />
                    {m.originalPrice > m.price && (
                      <span className="absolute top-1 right-1 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                        បញ្ចុះតម្លៃ
                      </span>
                    )}
                  </div>
                  <div className="p-2">
                    <p className="text-xs font-bold truncate text-white">{m.title}</p>
                    <div className="flex items-center justify-between mt-1">
                      <span className="text-amber-400 font-bold text-xs">${parseFloat(m.price).toFixed(2)}</span>
                      {m.originalPrice && <span className="text-neutral-500 line-through text-[10px]">${parseFloat(m.originalPrice).toFixed(2)}</span>}
                    </div>
                    <p className="text-[10px] text-neutral-400 mt-0.5">👁️ {m.views || 0} នាក់មើល</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function MoviesPage({ movies, onWatch }) {
      return (
        <div className="p-4">
          <h1 className="text-base font-bold text-center text-white mb-4">All Movies</h1>
          <div className="grid grid-cols-2 gap-3">
            {movies.map(m => (
              <div key={m.id} onClick={() => onWatch(m)} className="rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer">
                <img src={m.img} className="w-full h-48 object-cover" />
                <div className="p-2.5">
                  <p className="text-xs font-bold truncate text-white">{m.title}</p>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-amber-400 font-bold text-xs">${parseFloat(m.price).toFixed(2)}</span>
                    {m.originalPrice && <span className="text-neutral-500 line-through text-[10px]">${parseFloat(m.originalPrice).toFixed(2)}</span>}
                  </div>
                  <p className="text-[10px] text-neutral-400 mt-1">👁️ {m.views || 0} នាក់មើល</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WalletPage({ wallet, onOpenTopUp }) {
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-base font-bold text-center text-white mb-2">Wallet</h1>
          <div className="bg-[#171717] border border-neutral-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <p className="text-xs text-neutral-400">Balance</p>
              <h2 className="text-2xl font-bold text-amber-400">${wallet.balance.toFixed(2)} $</h2>
            </div>
            <button onClick={onOpenTopUp} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-5 py-2 rounded-xl text-xs transition">
              Top Up
            </button>
          </div>

          <div className="space-y-2 mt-4">
            {wallet.transactions.length === 0 ? (
              <p className="text-xs text-center text-neutral-500 py-6">មិនទាន់មានប្រវត្តិប្រតិបត្តិការនៅឡើយទេ។</p>
            ) : (
              wallet.transactions.map((tx, idx) => (
                <div key={idx} className="flex items-center justify-between py-3 border-b border-neutral-900">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full bg-neutral-800 flex items-center justify-center">
                      <i data-lucide={tx.type === 'income' ? 'wallet' : 'shopping-cart'} className="w-4 h-4 text-neutral-300"></i>
                    </div>
                    <div>
                      <p className="text-[11px] text-neutral-400">{tx.date}</p>
                      <p className="text-xs font-mono text-neutral-200">{tx.id}</p>
                    </div>
                  </div>
                  <div className={`font-bold text-sm ${tx.type === 'income' ? 'text-green-500' : 'text-red-500'}`}>
                    {tx.type === 'income' ? `+${tx.amount.toFixed(2)} $` : `-${tx.amount.toFixed(2)} $`}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function LibraryPage({ movies, wallet, onWatch }) {
      const purchased = movies.filter(m => wallet.purchasedMovieIds && wallet.purchasedMovieIds.includes(m.id));
      return (
        <div className="p-4">
          <h1 className="text-base font-bold text-center text-white mb-4">My Library (រឿងបានទិញរួច)</h1>
          {purchased.length === 0 ? (
            <p className="text-xs text-center text-neutral-500 py-10">អ្នកមិនទាន់បានទិញភាពយន្តណាមួយនៅឡើយទេ។</p>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              {purchased.map(m => (
                <div key={m.id} onClick={() => onWatch(m)} className="rounded-lg overflow-hidden bg-neutral-900 border border-amber-400/40 cursor-pointer">
                  <img src={m.img} className="w-full h-44 object-cover" />
                  <div className="p-2">
                    <p className="text-xs font-bold text-white truncate">{m.title}</p>
                    <span className="text-[10px] text-amber-400 font-bold block mt-0.5">▶ ចុចទស្សនា</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function TopUpModal({ onClose }) {
      const presetAmounts = ['1.60', '1.99', '5.00', '6.99', '10.00', '20.00'];
      const [selectedAmount, setSelectedAmount] = useState('1.99');
      const [customAmount, setCustomAmount] = useState('');
      const [isPaying, setIsPaying] = useState(false);
      const [khqrString, setKhqrString] = useState('');
      const qrRef = useRef(null);

      const activeAmount = customAmount ? customAmount : selectedAmount;

      const handleProceed = () => {
        if (!activeAmount || parseFloat(activeAmount) <= 0) return alert('សូមជ្រើសរើសចំនួនទឹកប្រាក់');
        setKhqrString(buildDynamicKHQR(activeAmount));
        setIsPaying(true);
      };

      useEffect(() => {
        if (isPaying && qrRef.current && khqrString) {
          qrRef.current.innerHTML = '';
          new QRCode(qrRef.current, {
            text: khqrString,
            width: 210,
            height: 210,
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }, [isPaying, khqrString]);

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
          <div className="w-full max-w-sm bg-white text-gray-800 rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl animate-fade-in">
            {!isPaying ? (
              <div className="p-6 bg-neutral-900 text-white rounded-t-3xl sm:rounded-3xl">
                <h3 className="text-base font-bold mb-1">Top up wallet</h3>
                <p className="text-neutral-400 text-xs mb-4">Select an amount to top up your wallet.</p>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  {presetAmounts.map(val => (
                    <button
                      key={val}
                      onClick={() => { setSelectedAmount(val); setCustomAmount(''); }}
                      className={`py-2.5 rounded-xl border text-xs font-bold transition flex flex-col items-center justify-center ${
                        selectedAmount === val && !customAmount ? 'border-amber-400 bg-amber-400/15 text-amber-400 scale-105' : 'border-neutral-800 bg-[#161616] text-neutral-300'
                      }`}
                    >
                      <span>${val}</span>
                      <span className="text-[9px] font-normal text-neutral-400">USD</span>
                    </button>
                  ))}
                </div>
                <div className="mb-5">
                  <label className="text-[11px] text-neutral-400 block mb-1.5 font-medium">ឬវាយបញ្ចូលចំនួនទឹកប្រាក់ ($ USD)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={customAmount}
                    onChange={(e) => { setCustomAmount(e.target.value); setSelectedAmount(''); }}
                    className="w-full bg-[#161616] border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400"
                  />
                </div>
                <button onClick={handleProceed} className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-3 rounded-xl text-xs transition shadow-lg">
                  បន្តទៅការទូទាត់ ${parseFloat(activeAmount || 0).toFixed(2)}
                </button>
                <button onClick={onClose} className="text-neutral-500 text-xs mt-3 block w-full text-center hover:text-neutral-300">បោះបង់</button>
              </div>
            ) : (
              <div>
                <div className="bg-[#e11d2a] text-white pt-3 pb-3 px-6 text-center relative khqr-header-cut">
                  <div className="w-10 h-1 bg-white/40 rounded-full mx-auto mb-2"></div>
                  <h2 className="text-xl font-black tracking-wider uppercase">KHQR</h2>
                </div>
                <div className="pt-4 pb-2 px-6 text-center">
                  <p className="text-xs font-medium text-gray-500">MON SAMNANG</p>
                  <div className="flex items-baseline justify-center gap-1 mt-1">
                    <span className="text-3xl font-black text-gray-900">{parseFloat(activeAmount).toFixed(2)}</span>
                    <span className="text-xs font-bold text-gray-500">USD</span>
                  </div>
                </div>
                <div className="relative my-2 border-b-2 border-dashed border-gray-200">
                  <div className="w-4 h-4 bg-[#0d0d0d] rounded-full absolute -left-2 -top-2"></div>
                  <div className="w-4 h-4 bg-[#0d0d0d] rounded-full absolute -right-2 -top-2"></div>
                </div>
                <div className="flex flex-col items-center justify-center p-4">
                  <div className="relative p-2 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center">
                    <div ref={qrRef} className="flex items-center justify-center"></div>
                    <div className="absolute w-9 h-9 bg-white rounded-full p-0.5 shadow flex items-center justify-center pointer-events-none">
                      <svg viewBox="0 0 100 100" className="w-full h-full text-[#e11d2a]" fill="currentColor">
                        <path d="M50 0 L58 18 L76 10 L74 30 L94 34 L82 50 L94 66 L74 70 L76 90 L58 82 L50 100 L42 82 L24 90 L26 70 L6 66 L18 50 L6 34 L26 30 L24 10 L42 18 Z" />
                        <circle cx="50" cy="50" r="18" fill="white" />
                        <circle cx="50" cy="50" r="12" fill="#e11d2a" />
                      </svg>
                    </div>
                  </div>
                  <p className="font-bold text-sm text-gray-800 mt-3">Scan to Pay</p>
                  <p className="text-xs text-gray-400 my-0.5">or</p>
                  <button 
                    onClick={() => {
                      const canvas = qrRef.current.querySelector('canvas');
                      if (canvas) {
                        const link = document.createElement('a');
                        link.download = `KHQR-${activeAmount}USD.png`;
                        link.href = canvas.toDataURL();
                        link.click();
                      }
                    }}
                    className="flex items-center gap-1.5 text-sky-500 hover:text-sky-600 font-semibold text-xs py-1"
                  >
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span>Download QR</span>
                  </button>
                </div>
                <div className="px-6 pb-5 pt-2">
                  <button onClick={onClose} className="w-full py-2.5 rounded-xl border border-neutral-300 text-gray-600 text-xs font-semibold hover:bg-gray-50 transition">
                    បិទផ្ទាំង
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
