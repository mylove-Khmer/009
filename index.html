<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC Web</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .khqr-header-cut {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }
  </style>
</head>
<body class="bg-[#121212] text-white font-sans selection:bg-amber-400 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ក្បួនបង្កើត Dynamic KHQR តាមកូដដើមរបស់ MON SAMNANG ---
    function crc16CCITT(str) {
      let crc = 0xFFFF;
      for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
          if (crc & 0x8000) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    // អនុគមន៍ភ្ជាប់ចំនួនទឹកប្រាក់ដែលបានជ្រើសរើសចូលទៅក្នុងកូដ KHQR ដើម
    function buildDynamicKHQR(amount) {
      const formattedAmount = parseFloat(amount).toFixed(2);
      const amtLength = formattedAmount.length < 10 ? '0' + formattedAmount.length : String(formattedAmount.length);
      const tag54 = `54${amtLength}${formattedAmount}`; // Tag ចំនួនទឹកប្រាក់

      const part1 = "00020101021230510016abaakhppxxx@abaa01151260903142910660208ABA Bank520465135303840";
      const part2 = "5802KH5911MON SAMNANG6012KAMPONG THOM624268380010PAYWAY@ABA0107195096202090324860766304";

      const rawPayload = part1 + tag54 + part2;
      const checksum = crc16CCITT(rawPayload);
      return rawPayload + checksum;
    }

    const MOVIES = [
      { id: 1, title: "The Last Ritual", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80" },
      { id: 2, title: "Horror Night", img: "https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=500&q=80" },
      { id: 3, title: "The Dark Soul", img: "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80" },
      { id: 4, title: "Ancient Mystery", img: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=500&q=80" }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [showTopUp, setShowTopUp] = useState(false);

      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem('user_wallet');
        return saved ? JSON.parse(saved) : {
          balance: 2.15,
          transactions: [
            { id: 'ADC-696867-0066', date: '16 May 2026', type: 'expense', amount: 1.60 },
            { id: 'ADC-696867-0065', date: '15 May 2026', type: 'expense', amount: 1.60 },
            { id: 'ADC-696867-0064', date: '15 May 2026', type: 'expense', amount: 1.60 },
            { id: 'ADC-696867-0063', date: '08 May 2026', type: 'expense', amount: 1.60 },
            { id: 'WALLET-696867-0006', date: '08 May 2026', type: 'income', amount: 6.99 },
            { id: 'ADC-696867-0062', date: '27 March 2026', type: 'expense', amount: 1.60 },
            { id: 'WALLET-696867-0005', date: '24 March 2026', type: 'income', amount: 1.99 }
          ]
        };
      });

      useEffect(() => {
        localStorage.setItem('user_wallet', JSON.stringify(wallet));
      }, [wallet]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentTab, showTopUp]);

      const handleAddFund = (amount, billNo) => {
        const numAmount = parseFloat(amount);
        setWallet(prev => ({
          balance: parseFloat((prev.balance + numAmount).toFixed(2)),
          transactions: [
            {
              id: billNo,
              date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
              type: 'income',
              amount: numAmount
            },
            ...prev.transactions
          ]
        }));
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#0d0d0d] flex flex-col justify-between relative shadow-2xl pb-20 border-x border-neutral-900">
          <header className="flex items-center justify-between px-4 py-3 sticky top-0 bg-[#0d0d0d]/95 backdrop-blur border-b border-neutral-900 z-40">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 bg-amber-500 rounded flex items-center justify-center font-black text-black text-sm">A</div>
              <span className="text-lg font-bold tracking-wide text-white">Angkor DC</span>
            </div>
            <div className="flex items-center gap-4 text-neutral-300">
              <i data-lucide="search" className="w-5 h-5 cursor-pointer"></i>
              <i data-lucide="bell" className="w-5 h-5 cursor-pointer"></i>
              <i data-lucide="user" className="w-5 h-5 cursor-pointer"></i>
            </div>
          </header>

          <main className="flex-1">
            {currentTab === 'home' && <HomePage onWatch={() => setCurrentTab('movies')} />}
            {currentTab === 'movies' && <MoviesPage />}
            {currentTab === 'wallet' && <WalletPage wallet={wallet} onOpenTopUp={() => setShowTopUp(true)} />}
            {currentTab === 'library' && <LibraryPage />}
          </main>

          <nav className="fixed bottom-0 max-w-md w-full bg-[#141414] border-t border-neutral-800 flex justify-around py-2.5 z-40">
            {[
              { id: 'home', label: 'Home', icon: 'home' },
              { id: 'movies', label: 'All Movies', icon: 'film' },
              { id: 'wallet', label: 'Wallet', icon: 'wallet' },
              { id: 'library', label: 'Library', icon: 'bookmark' },
            ].map(tab => (
              <button 
                key={tab.id} 
                onClick={() => setCurrentTab(tab.id)}
                className={`flex flex-col items-center gap-1 ${currentTab === tab.id ? 'text-amber-400' : 'text-neutral-500'}`}
              >
                <i data-lucide={tab.icon} className="w-5 h-5"></i>
                <span className="text-[10px] font-medium">{tab.label}</span>
              </button>
            ))}
          </nav>

          {showTopUp && (
            <TopUpModal 
              onClose={() => setShowTopUp(false)} 
              onSuccess={(amt, bill) => { 
                handleAddFund(amt, bill);
                setShowTopUp(false);
              }}
            />
          )}
        </div>
      );
    }

    function HomePage({ onWatch }) {
      return (
        <div className="space-y-6">
          <div className="relative w-full h-[420px]">
            <img src={MOVIES[0].img} className="w-full h-full object-cover brightness-75" />
            <div className="absolute inset-0 bg-gradient-to-t from-[#0d0d0d] via-transparent to-black/40"></div>
            <div className="absolute bottom-6 left-0 right-0 flex flex-col items-center gap-3">
              <h1 className="text-2xl font-black tracking-widest text-red-500 drop-shadow-md">THE LAST RITUAL</h1>
              <button onClick={onWatch} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-8 py-2.5 rounded-full shadow-lg transition text-sm">
                Watch Movie
              </button>
            </div>
          </div>

          {['Coming Soon', 'New Release', 'Horror-Comedy'].map((sec, i) => (
            <div key={i} className="px-4">
              <h2 className="text-sm font-bold text-white mb-2 flex items-center gap-1">
                {sec} <span className="text-amber-400 text-xs">›</span>
              </h2>
              <div className="flex gap-3 overflow-x-auto no-scrollbar py-1">
                {MOVIES.map(m => (
                  <div key={m.id} className="flex-none w-32 rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                    <img src={m.img} className="w-full h-44 object-cover" />
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function MoviesPage() {
      return (
        <div className="p-4">
          <h1 className="text-base font-bold text-center text-white mb-4">All Movies</h1>
          <div className="grid grid-cols-3 gap-2.5">
            {[...MOVIES, ...MOVIES, ...MOVIES].map((m, i) => (
              <div key={i} className="rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src={m.img} className="w-full h-40 object-cover" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WalletPage({ wallet, onOpenTopUp }) {
      return (
        <div className="p-4 space-y-4">
          <h1 className="text-base font-bold text-center text-white mb-2">Wallet</h1>
          <div className="bg-[#171717] border border-neutral-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <p className="text-xs text-neutral-400">Balance</p>
              <h2 className="text-2xl font-bold text-amber-400">${wallet.balance.toFixed(2)} $</h2>
            </div>
            <button onClick={onOpenTopUp} className="bg-amber-400 hover:bg-amber-500 text-black font-bold px-5 py-2 rounded-xl text-xs transition">
              Top Up
            </button>
          </div>

          <div className="space-y-2 mt-4">
            {wallet.transactions.map((tx, idx) => (
              <div key={idx} className="flex items-center justify-between py-3 border-b border-neutral-900">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-neutral-800 flex items-center justify-center">
                    <i data-lucide={tx.type === 'income' ? 'wallet' : 'shopping-cart'} className="w-4 h-4 text-neutral-300"></i>
                  </div>
                  <div>
                    <p className="text-[11px] text-neutral-400">{tx.date}</p>
                    <p className="text-xs font-mono text-neutral-200">{tx.id}</p>
                  </div>
                </div>
                <div className={`font-bold text-sm ${tx.type === 'income' ? 'text-green-500' : 'text-red-500'}`}>
                  {tx.type === 'income' ? `+${tx.amount.toFixed(2)} $` : `-${tx.amount.toFixed(2)} $`}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LibraryPage() {
      return (
        <div className="p-4">
          <h1 className="text-base font-bold text-center text-white mb-4">My Library</h1>
          <div className="grid grid-cols-3 gap-2.5">
            {MOVIES.slice(0, 3).map((m, i) => (
              <div key={i} className="rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src={m.img} className="w-full h-40 object-cover" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Modal Top Up (កំណត់ឱ្យភ្ញៀវចុចរើសតែប៉ុណ្ណោះ មិនអាចវាយបញ្ចូលលុយបានទេ)
    function TopUpModal({ onClose, onSuccess }) {
      // កំណត់កញ្ចប់ទឹកប្រាក់ជាក់លាក់
      const presetAmounts = ['1.60', '1.99', '5.00', '6.99', '10.00', '20.00'];
      const [selectedAmount, setSelectedAmount] = useState('1.99');
      const [isPaying, setIsPaying] = useState(false);
      const [billNo, setBillNo] = useState('');
      const [khqrString, setKhqrString] = useState('');
      const qrRef = useRef(null);

      const handleProceed = () => {
        const currentBill = 'ADC-' + Math.floor(100000 + Math.random() * 900000);
        setBillNo(currentBill);

        // បង្កើតកូដ Dynamic KHQR តាមកញ្ចប់ដែលភ្ញៀវបានចុចរើស
        const dynamicQR = buildDynamicKHQR(selectedAmount);
        setKhqrString(dynamicQR);
        setIsPaying(true);
      };

      useEffect(() => {
        if (isPaying && qrRef.current && khqrString) {
          qrRef.current.innerHTML = '';
          new QRCode(qrRef.current, {
            text: khqrString,
            width: 210,
            height: 210,
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }, [isPaying, khqrString]);

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
          <div className="w-full max-w-sm bg-white text-gray-800 rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl animate-fade-in">
            
            {!isPaying ? (
              <div className="p-6 bg-neutral-900 text-white rounded-t-3xl sm:rounded-3xl">
                <h3 className="text-base font-bold mb-1">Top up wallet</h3>
                <p className="text-neutral-400 text-xs mb-5">Select an amount to top up your wallet.</p>
                
                {/* បញ្ជីកញ្ចប់ទឹកប្រាក់ដែលកំណត់ស្រាប់សម្រាប់ជ្រើសរើស */}
                <div className="grid grid-cols-3 gap-2.5 mb-6">
                  {presetAmounts.map(val => (
                    <button
                      key={val}
                      onClick={() => setSelectedAmount(val)}
                      className={`py-3 rounded-xl border text-sm font-bold transition flex flex-col items-center justify-center ${
                        selectedAmount === val 
                          ? 'border-amber-400 bg-amber-400/15 text-amber-400 shadow-md scale-105' 
                          : 'border-neutral-800 bg-[#161616] text-neutral-300 hover:border-neutral-700'
                      }`}
                    >
                      ${val}
                      <span className="text-[10px] font-normal text-neutral-400">USD</span>
                    </button>
                  ))}
                </div>

                <button
                  onClick={handleProceed}
                  className="w-full bg-amber-400 hover:bg-amber-500 text-black font-bold py-3 rounded-xl text-xs transition shadow-lg"
                >
                  បន្តទៅការទូទាត់ ${selectedAmount}
                </button>
                <button onClick={onClose} className="text-neutral-500 text-xs mt-3 block w-full text-center">បោះបង់</button>
              </div>
            ) : (
              <div>
                {/* Header ក្រហម KHQR */}
                <div className="bg-[#e11d2a] text-white pt-3 pb-3 px-6 text-center relative khqr-header-cut">
                  <div className="w-10 h-1 bg-white/40 rounded-full mx-auto mb-2"></div>
                  <h2 className="text-xl font-black tracking-wider uppercase">KHQR</h2>
                </div>

                {/* ព័ត៌មានក្រុមហ៊ុន និងចំនួនទឹកប្រាក់ដែលភ្ញៀវរើស */}
                <div className="pt-4 pb-2 px-6 text-center">
                  <p className="text-xs font-medium text-gray-500">MON SAMNANG</p>
                  <div className="flex items-baseline justify-center gap-1 mt-1">
                    <span className="text-3xl font-black text-gray-900">{parseFloat(selectedAmount).toFixed(2)}</span>
                    <span className="text-xs font-bold text-gray-500">USD</span>
                  </div>
                </div>

                {/* បន្ទាត់សំបុត្រ (Dashed Ticket Line) */}
                <div className="relative my-2 border-b-2 border-dashed border-gray-200">
                  <div className="w-4 h-4 bg-[#0d0d0d] rounded-full absolute -left-2 -top-2"></div>
                  <div className="w-4 h-4 bg-[#0d0d0d] rounded-full absolute -right-2 -top-2"></div>
                </div>

                {/* ផ្ទាំង QR Code */}
                <div className="flex flex-col items-center justify-center p-4">
                  <div className="relative p-2 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center">
                    <div ref={qrRef} className="flex items-center justify-center"></div>
                    
                    {/* Logo ផ្កាចន្ទ Bakong */}
                    <div className="absolute w-9 h-9 bg-white rounded-full p-0.5 shadow flex items-center justify-center pointer-events-none">
                      <svg viewBox="0 0 100 100" className="w-full h-full text-[#e11d2a]" fill="currentColor">
                        <path d="M50 0 L58 18 L76 10 L74 30 L94 34 L82 50 L94 66 L74 70 L76 90 L58 82 L50 100 L42 82 L24 90 L26 70 L6 66 L18 50 L6 34 L26 30 L24 10 L42 18 Z" />
                        <circle cx="50" cy="50" r="18" fill="white" />
                        <circle cx="50" cy="50" r="12" fill="#e11d2a" />
                      </svg>
                    </div>
                  </div>

                  <p className="font-bold text-sm text-gray-800 mt-3">Scan to Pay</p>
                  <p className="text-xs text-gray-400 my-0.5">or</p>
                  
                  {/* ប៊ូតុង Download QR */}
                  <button 
                    onClick={() => {
                      const canvas = qrRef.current.querySelector('canvas');
                      if (canvas) {
                        const link = document.createElement('a');
                        link.download = `KHQR-${selectedAmount}USD.png`;
                        link.href = canvas.toDataURL();
                        link.click();
                      }
                    }}
                    className="flex items-center gap-1.5 text-sky-500 hover:text-sky-600 font-semibold text-xs py-1"
                  >
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span>Download QR</span>
                  </button>
                  <p className="text-[10px] text-gray-400 mt-1 max-w-[200px] text-center leading-tight">
                    and upload to Mobile Banking app supporting KHQR
                  </p>
                </div>

                {/* ប៊ូតុងទូទាត់ */}
                <div className="px-6 pb-5 space-y-2">
                  <a 
                    href={`bakong://qr?qr=${encodeURIComponent(khqrString)}`}
                    className="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow transition"
                  >
                    <span>បើកទូទាត់ក្នុង Bakong App</span>
                  </a>

                  <button 
                    onClick={() => onSuccess(selectedAmount, billNo)}
                    className="w-full bg-amber-400 hover:bg-amber-500 text-black py-2.5 rounded-xl text-xs font-bold transition"
                  >
                    ខ្ញុំបានបាញ់លុយរួចរាល់
                  </button>
                  
                  <button 
                    onClick={onClose} 
                    className="text-gray-400 text-xs text-center w-full block hover:text-gray-600 pt-1"
                  >
                    បិទផ្ទាំង
                  </button>
                </div>

              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
